# Example study: SIMULATED single-arm rare-dermatology trial (no real data).
schema_version: 1
study_id: DERM-301-SIM
visit_schedule: visit_schedule.csv
mapping_spec: mapping_spec.xlsx
extracts: extracts
test_sites: ["999"]
# Review thresholds (used by later steps: derivations, checks, displays)
thresholds:
  pk_alert: 1.5          # ng/mL
  pk_limit: 2.0          # ng/mL systemic exposure threshold
  lloq: 0.1              # ng/mL
  compliance: 80         # %
  entry_lag_target: 5    # days
  min_n: 3

# Checks switched on for this study. Library checks by ID; study checks
# configure a library check type. "$name" parameters read thresholds above.
# Prototype equivalents (prototype/R/checks.R) in brackets.
checks:
  - STR-001                               # [SC-002]
  - STR-002                               # [SC-009]
  - STR-003                               # [SC-004]
  - STR-004                               # [SC-005]
  - STR-005                               # [SC-003]
  - STR-006
  - id: XF-IGA-001                        # [SC-006]
    type: reconcile
    name: IGA entered for each post-baseline visit
    description: Visit done at a visit that schedules IGA, but no IGA record
    tier: cross-form
    severity: warning
    owner: data management
    params:
      form_a: SV
      form_b: IGA
      schedule_flag: IGAFL
      when_a: [{field: VISND, op: missing}]
  - id: RC-MCSS-001                       # [SC-007]
    type: reconcile
    name: Central mCSS read received
    description: Visit done, but no central mCSS read from the imaging vendor yet
    tier: reconciliation
    severity: warning
    owner: data management
    params:
      form_a: SV
      form_b: MCSS
      when_a: [{field: VISND, op: missing}]
  - id: DM-AE-001                         # [SC-008]
    type: missing_value
    name: AE coded
    description: Adverse event entered but not yet MedDRA coded
    tier: structural
    severity: info
    owner: data management
    params: {form: AE, fields: AEDECOD, message: Awaiting MedDRA coding}
  - id: DM-DRY-001                        # [SC-010]
    type: range
    name: Diary missed doses in range
    description: Missed doses between 0 and doses prescribed
    tier: cross-form
    severity: error
    owner: sites
    params: {form: DIARY, field: DOSMISS, min: 0, max: DOSPRESC}
  - id: XF-SV-001                         # [SC-011]
    type: date_order
    name: Post-baseline visit after first dose
    description: Post-baseline visit date on or before the first dose date
    tier: cross-form
    severity: warning
    owner: sites
    params:
      form: SV
      field: VISDAT
      ref_form: EX
      ref_field: EXSTDAT
      op: after
      when: [{field: VISITNUM, op: ">", value: 2}]
  - id: RC-PK-001
    type: reconcile
    name: PK sample on the visit date
    description: PK collection date differs from the visit date, or no visit for the sample
    tier: reconciliation
    severity: warning
    owner: data management
    params: {form_a: PK, form_b: SV, date_a: PCDTC, date_b: VISDAT, tolerance: 0}
  - id: CL-PK-001
    type: flag_when
    name: PK at or above alert level
    description: Systemic exposure at or above the study PK alert threshold
    tier: clinical
    severity: warning
    owner: safety
    params:
      form: PK
      field: PCSTRESN
      message: PK concentration at or above alert level
      when: [{field: PCSTRESN, op: ">=", value: $pk_alert}]
  - id: CL-IGA-001
    type: flag_when
    name: IGA worsening
    description: Investigator Global Assessment shows worsening
    tier: clinical
    severity: info
    owner: clinical
    params:
      form: IGA
      field: IGASCORE
      message: IGA worse than baseline
      when: [{field: IGASCORE, op: "<", value: 0}]

# Standard derivations, run in order on the as-of snapshot.
derivations:
  - id: REF
    type: reference_dates
    description: Enrollment, first dose and last contact per subject
    params:
      subject_form: DM
      dates:
        - {name: ENRLDT, from: [{form: DM, field: ENRLDAT}]}
        - {name: TRTSDT, from: [{form: EX, field: EXSTDAT}]}
        - {name: LSTCNTDT, pick: last, from: [{form: SV, field: VISDAT}, {form: MCSS, field: PHOTODT}]}
  - id: STATUS
    type: subject_status
    description: Ongoing, completed, discontinued or screen failure from disposition
    params: {form: DS, field: DSDECOD, date: DSSTDAT, completed: COMPLETED, screen_failure: SCREEN FAILURE}
  - id: AE-IMPUTE
    type: impute_date
    description: Complete partial AE start dates for derivations; never before first dose in the same month
    params: {form: AE, field: AESTDAT, to: ASTDT, rule: first, not_before: TRTSDT}
  - id: STUDY-DAY
    type: study_day
    description: Study day from first dose, no day 0
    params:
      items:
        - {form: AE, field: ASTDT, to: ASTDY}
        - {form: SV, field: VISDAT, to: ADY}
  - id: TEAE
    type: treatment_emergent
    description: AE starting on or after first dose
    params: {form: AE, start: ASTDT}
  - id: PERIOD
    type: period
    description: Screening, run-in or treatment
    params:
      boundaries:
        - {name: Run-in, from: ENRLDT}
        - {name: Treatment, from: TRTSDT}
      items:
        - {form: SV, field: VISDAT}
        - {form: AE, field: ASTDT}
  - id: AVISIT
    type: analysis_visit
    description: Window flag for each visit; unscheduled visits go to the nearest nominal visit
    params: {form: SV, field: VISDAT, keep_scheduled: true}
  - id: MCSS-BASE
    type: baseline
    description: mCSS baseline is the last central read on or before first dose
    params: {form: MCSS, value: MCSS, date: PHOTODT, rule: last_before_ref}
  - id: COMPLIANCE
    type: compliance
    description: Dosing compliance per diary interval
    params: {form: DIARY, prescribed: DOSPRESC, missed: DOSMISS}
  - id: PK
    type: pk_timing
    description: Analysis value with BLQ results set to missing
    params: {form: PK, value: PCSTRESN, blq_flag: PCBLQFL, blq_rule: missing, lloq: PCLLOQ}
  - id: WORST-AE
    type: worst
    description: Most severe treatment-emergent AE per subject
    params:
      form: AE
      field: AESEV
      order: [MILD, MODERATE, SEVERE]
      when: [{field: TRTEMFL, op: "==", value: "Y"}]
